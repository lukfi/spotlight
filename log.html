<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Service Log Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>(function(){var t=localStorage.getItem('theme');if(t==='black')document.documentElement.setAttribute('data-theme','black');})();</script>
  <link rel="stylesheet" href="theme.css" />
  <style>
    body {
      background: var(--bg);
      color: var(--text);
      font-family: monospace;
      margin: 0;
      padding: 20px;
    }

    h1 {
      font-size: 1.5em;
      margin-bottom: 16px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    button {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9em;
      transition: opacity 0.2s;
    }

    button.inactive {
      opacity: 0.3;
    }

    .section-title {
      font-weight: bold;
      margin: 10px 0 5px 0;
      color: var(--muted);
    }

    .log-container {
      background: var(--bg0);
      border-radius: 8px;
      padding: 10px;
      height: 70vh;
      overflow-y: auto;
      box-shadow: inset 0 0 6px rgba(255,255,255,0.1);
    }

    .log-line {
      margin-bottom: 3px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .debug { color: #999; }
    .info { color: #3af; }
    .warning { color: #ffcc00; }
    .error { color: #f55; }
    .success { color: #5f5; }
    .unknown { color: #aaa; }

    .timestamp {
      color: #666;
      margin-right: 6px;
    }
  </style>
</head>
<body>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
    <h1 style="margin:0">Service Log Viewer</h1>
    <button id="themeToggle">Black</button>
  </div>

  <div class="section-title">Type Filters:</div>
  <div class="filters" id="typeFilters">
    <button data-type="debug" class="debug active">DEBUG</button>
    <button data-type="info" class="info active">INFO</button>
    <button data-type="warning" class="warning active">WARNING</button>
    <button data-type="error" class="error active">ERROR</button>
    <button data-type="success" class="success active">SUCCESS</button>
    <button data-type="unknown" class="unknown active">UNKNOWN</button>
  </div>

  <div class="section-title">Component Filters:</div>
  <div class="filters" id="componentFilters"></div>

  <div class="log-container" id="logContainer">Loading logs...</div>

  <script>
    const logContainer = document.getElementById("logContainer");
    const typeButtons = document.querySelectorAll("#typeFilters button");
    const componentFilterContainer = document.getElementById("componentFilters");

    const typeFilter = {
      debug: true,
      info: true,
      warning: true,
      error: true,
      success: true,
      unknown: true,
    };

    const componentFilter = {}; // dynamically discovered

    let allLogs = [];

    function esc(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Handle type filter toggles
    typeButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        const type = btn.dataset.type;
        typeFilter[type] = !typeFilter[type];
        btn.classList.toggle("inactive", !typeFilter[type]);
        renderLogs();
      });
    });

    // Create a new component button if not already present
    function ensureComponentButton(name) {
      if (name === undefined || name === null) name = "";
      if (componentFilter[name] !== undefined) return;

      componentFilter[name] = true;

      const btn = document.createElement("button");
      btn.textContent = name || "(no component)";
      btn.dataset.component = name;
      btn.className = "active";
      btn.addEventListener("click", () => {
        const c = btn.dataset.component;
        componentFilter[c] = !componentFilter[c];
        btn.classList.toggle("inactive", !componentFilter[c]);
        renderLogs();
      });
      componentFilterContainer.appendChild(btn);
    }

    async function fetchLogs() {
      try {
        const res = await fetch("/api/log");
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();

        if (!Array.isArray(data)) throw new Error("Expected JSON array");
        allLogs = data;

        // Discover new components
        const uniqueComponents = new Set(data.map(l => l.component || ""));
        uniqueComponents.forEach(ensureComponentButton);

        renderLogs();
      } catch (err) {
        console.error("Log fetch error:", err);
        logContainer.innerHTML = `<div class="error">Error loading logs: ${esc(err.message)}</div>`;
      }
    }

    function renderLogs() {
      const filtered = allLogs.filter(
        l =>
          typeFilter[l.type] &&
          componentFilter[l.component ?? ""]
      );

      logContainer.innerHTML = "";

      if (filtered.length === 0) {
        logContainer.innerHTML = "<div style='color:#666'>No logs to display</div>";
        return;
      }

      for (const log of filtered) {
        const line = document.createElement("div");
        line.className = `log-line ${log.type}`;
        const time = new Date(log.time).toLocaleTimeString();
        const comp = log.component ? `[${esc(log.component)}] ` : "";
        line.innerHTML = `<span class="timestamp">[${time}]</span> ${comp}${esc(log.text)}`;
        logContainer.appendChild(line);
      }

      logContainer.scrollTop = logContainer.scrollHeight;
    }

    // Theme toggle
    (function(){
      var btn = document.getElementById('themeToggle');
      btn.textContent = localStorage.getItem('theme') === 'black' ? 'Dark' : 'Black';
      btn.addEventListener('click', function(){
        var next = localStorage.getItem('theme') === 'black' ? 'dark' : 'black';
        localStorage.setItem('theme', next);
        document.documentElement.setAttribute('data-theme', next === 'black' ? 'black' : '');
        btn.textContent = next === 'black' ? 'Dark' : 'Black';
      });
    })();

    // Fetch immediately and every 3 seconds
    fetchLogs();
    setInterval(fetchLogs, 3000);
  </script>
</body>
</html>
